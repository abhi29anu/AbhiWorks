<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <rect width="100%" height="100%" fill="#ffffff" stroke="none" />
  <!-- Note Document with Pencil (Top-Left Background) -->
  <rect x="55" y="65" width="115" height="150" rx="4" />
  <line x1="75" y1="88" x2="135" y2="88" stroke-width="3.5" />
  <line x1="75" y1="104" x2="120" y2="104" stroke-width="3.5" />
  <line x1="75" y1="120" x2="140" y2="120" stroke-width="3.5" />
  <!-- Diagonal Pencil pointing at note -->
  <g transform="rotate(-35 85 95)">
    <rect x="50" y="85" width="95" height="16" rx="3" fill="#ffffff" stroke-width="3.5" />
    <polygon points="50,85 32,93 50,101" fill="#000000" />
    <line x1="60" y1="85" x2="60" y2="101" />
  </g>

  <!-- Desktop Monitor Stand & Base -->
  <rect x="85" y="150" width="200" height="160" rx="10" stroke-width="4" />
  <rect x="170" y="310" width="30" height="25" />
  <path d="M135 335 L 235 335" stroke-width="4.5" />

  <!-- Inside Screen - Pie Chart Widget (Left) -->
  <rect x="75" y="170" width="130" height="95" rx="5" fill="#ffffff" />
  <!-- Pie Chart -->
  <circle cx="118" cy="220" r="28" stroke-width="3.5" />
  <line x1="118" y1="220" x2="118" y2="192" stroke-width="3.5" />
  <line x1="118" y1="220" x2="142" y2="206" stroke-width="3.5" />
  <line x1="118" y1="220" x2="140" y2="236" stroke-width="3.5" />
  <!-- Stats lines next to pie chart -->
  <line x1="155" y1="205" x2="190" y2="205" stroke-width="3" />
  <line x1="155" y1="220" x2="185" y2="220" stroke-width="3" />
  <line x1="155" y1="235" x2="175" y2="235" stroke-width="3" />

  <!-- Inside Screen - Right Window with Graph -->
  <rect x="160" y="125" width="145" height="105" rx="5" fill="#ffffff" stroke-width="3.5" />
  <line x1="175" y1="145" x2="175" y2="210" />
  <line x1="175" y1="210" x2="290" y2="210" />
  <!-- Rising Graph Line inside screen -->
  <path d="M185 198 L 220 178 L 250 188 L 285 155" stroke-width="3.5" />
  <path d="M280 155 L 285 155 L 285 160" stroke-width="3.5" />

  <!-- Foreground Huge Magnifying Glass examining the graph -->
  <!-- Glass Rim -->
  <circle cx="260" cy="155" r="80" stroke-width="12" />
  <!-- Lens Glare -->
  <path d="M215 130 A 65 65 0 0 1 270 95" stroke-width="4.5" />
  <!-- Zoomed Line inside Magnifier -->
  <path d="M228 185 L 248 165 L 268 175 L 290 142" stroke-width="4.5" />
  <circle cx="290" cy="142" r="3" fill="#000000" />
  <!-- Handle -->
  <g transform="rotate(45 320 215)">
    <rect x="300" y="210" width="85" height="24" rx="8" fill="#ffffff" stroke-width="4.5" />
  </g>
</svg>
