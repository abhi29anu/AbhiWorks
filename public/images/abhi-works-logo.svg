<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none" class="w-full h-full">
  <!-- Stylized Monogram AW with Arrow and Brand Text -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left spine of 'A' rising up -->
    <path 
      d="M 166 587 C 190 490 230 330 286 274 C 302 258 322 268 338 290 C 378 344 434 466 462 572 C 470 600 473 624 472 635" 
      stroke-width="12" 
    />
    <!-- Lower tapering tail of 'A' extending down-left -->
    <path 
      d="M 472 635 C 470 690 455 770 405 848" 
      stroke-width="11" 
      stroke-linecap="round"
    />
    <!-- Feathered contour lines along the right arc of 'A' -->
    <path 
      d="M 308 288 C 342 334 390 430 422 515 C 438 556 448 595 452 622" 
      stroke-width="5" 
    />
    <path 
      d="M 326 312 C 354 352 396 438 424 506" 
      stroke-width="3" 
    />

    <!-- 'W' stroke: from inflection (472, 635) up to peak (575, 430) -->
    <path 
      d="M 472 635 L 575 430" 
      stroke-width="14" 
    />
    <!-- 'W' middle stroke: down to valley (663, 582) -->
    <path 
      d="M 575 430 L 663 582" 
      stroke-width="14" 
    />
    <!-- 'W' right rising stroke / arrow shaft: up to arrow tip (830, 155) -->
    <path 
      d="M 663 582 C 685 530 735 340 829 156" 
      stroke-width="13" 
    />

    <!-- Arrow head at (829, 156) -->
    <path 
      d="M 802 157 L 829 156 L 833 178" 
      stroke-width="7" 
    />
  </g>

  <!-- Horizontal 'ABHI WORKS' text -->
  <text 
    x="316" 
    y="514" 
    text-anchor="middle" 
    fill="currentColor" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
    font-size="20" 
    font-weight="700" 
    letter-spacing="0.32em"
  >
    ABHI  WORKS
  </text>
</svg>