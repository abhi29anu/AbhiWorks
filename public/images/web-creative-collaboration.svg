<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <rect width="100%" height="100%" fill="#ffffff" stroke="none" />
  <!-- Central Browser Window "Your Creative Home" -->
  <g transform="rotate(-6 195 230)">
    <rect x="130" y="170" width="135" height="100" rx="4" fill="#ffffff" stroke-width="3.5" />
    <!-- Browser header -->
    <circle cx="138" cy="180" r="1.5" fill="#000000" stroke="none" />
    <circle cx="144" cy="180" r="1.5" fill="#000000" stroke="none" />
    <circle cx="150" cy="180" r="1.5" fill="#000000" stroke="none" />
    <!-- URL search bar with "Your Creative Home" -->
    <rect x="156" y="174" width="80" height="12" rx="3" />
    <text x="160" y="183" font-family="sans-serif" font-size="7" font-weight="bold" fill="#000000" stroke="none">Your Creative Home</text>
    <!-- Inner image mockup -->
    <rect x="142" y="196" width="105" height="62" rx="2" />
    <circle cx="218" cy="214" r="5" />
    <path d="M145 250 L 178 220 L 210 242 L 235 228 L 245 240" />
  </g>

  <!-- Hand 1 (Top Left): Holding Lightbulb Idea -->
  <path d="M60 210 C 80 185 110 160 135 152 C 145 150 152 165 142 170 C 132 174 125 185 110 200" />
  <!-- Lightbulb -->
  <path d="M115 130 C 105 130 98 138 100 148 C 102 155 108 160 112 165 L 126 165 C 130 160 136 155 138 148 C 140 138 133 130 123 130 Z" stroke-width="3.5" />
  <path d="M112 145 Q 118 135 124 145" />
  <!-- Glow rays around bulb -->
  <line x1="120" y1="118" x2="120" y2="112" />
  <line x1="98" y1="128" x2="92" y2="124" />
  <line x1="142" y1="128" x2="148" y2="124" />

  <!-- Curved Arrow pointing right -->
  <path d="M120 85 C 138 60 178 60 186 95" stroke-width="3.5" />
  <path d="M178 80 L 186 95 L 198 88" stroke-width="3.5" />

  <!-- Hand 2 (Top Right): Holding Star -->
  <path d="M340 100 C 310 120 280 155 255 170 C 248 175 240 160 248 152 C 258 142 278 120 305 105" />
  <!-- Star -->
  <polygon points="245,130 252,148 270,148 255,160 262,178 245,166 228,178 235,160 220,148 238,148" stroke-width="3.5" />

  <!-- Hand 3 (Bottom Right): Holding Pen Drawing on Window -->
  <path d="M330 310 C 315 280 290 250 270 235 C 265 230 255 242 262 250 C 275 265 295 295 305 325" />
  <line x1="295" y1="290" x2="315" y2="280" />
  <!-- Marker Pen -->
  <rect x="268" y="215" width="38" height="16" rx="4" transform="rotate(-35 268 215)" stroke-width="3.5" />
  <polygon points="266,218 258,228 274,228" fill="#000000" />

  <!-- Hand 4 (Bottom Left): Touching bottom edge -->
  <path d="M140 320 C 160 295 190 268 225 262 C 235 260 238 275 228 280 C 205 288 178 310 160 335" />
  <line x1="165" y1="305" x2="190" y2="290" />

  <!-- Coffee Mug with smiley sticky note -->
  <circle cx="105" cy="265" r="16" stroke-width="3.5" />
  <circle cx="105" cy="265" r="11" fill="#000000" />
  <!-- Mug handle -->
  <path d="M89 265 C 80 265 80 258 89 258" stroke-width="3.5" />
  <!-- Sticky note -->
  <rect x="98" y="268" width="32" height="32" rx="2" transform="rotate(10 98 268)" />
  <path d="M112 288 Q 118 296 124 288" />
  <circle cx="114" cy="282" r="1" fill="#000000" stroke="none" />
  <circle cx="122" cy="282" r="1" fill="#000000" stroke="none" />
</svg>
