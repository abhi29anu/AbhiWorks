<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <rect width="100%" height="100%" fill="#ffffff" stroke="none" />
  <!-- Main Large Dashboard Screen -->
  <rect x="75" y="135" width="205" height="145" rx="8" stroke-width="3.5" />
  <!-- Speedometer gauge -->
  <path d="M95 185 A 25 25 0 0 1 140 185" />
  <line x1="117" y1="185" x2="130" y2="172" stroke-width="3.5" />
  <circle cx="117" cy="185" r="2" fill="#000000" />
  <path d="M142 165 L 146 160 L 148 167" />

  <!-- Data lists -->
  <rect x="165" y="150" width="35" height="12" rx="2" />
  <line x1="218" y1="152" x2="238" y2="152" />
  <line x1="218" y1="160" x2="238" y2="160" />
  <circle cx="245" cy="152" r="1.5" fill="#000000" />
  <circle cx="245" cy="160" r="1.5" fill="#000000" />

  <!-- Lower dashboard widget with sliders -->
  <rect x="180" y="220" width="55" height="42" rx="4" />
  <line x1="190" y1="232" x2="225" y2="232" />
  <line x1="190" y1="242" x2="225" y2="242" />
  <line x1="205" y1="228" x2="205" y2="236" stroke-width="3.5" />
  <line x1="215" y1="238" x2="215" y2="246" stroke-width="3.5" />

  <!-- Upward Trajectory Launch Curve -->
  <path d="M85 240 Q 115 220 135 240 T 175 195 C 205 170 230 145 255 105" stroke-width="4" />

  <!-- Rocket Blasting Off -->
  <g transform="translate(250, 85) rotate(-20)">
    <!-- Rocket Body -->
    <path d="M10 0 C 22 5 28 20 28 35 L 5 35 C 5 20 0 5 10 0 Z" fill="#ffffff" stroke-width="3" />
    <circle cx="16" cy="18" r="4" />
    <!-- Fins -->
    <path d="M5 25 L 0 38 L 8 36" fill="#000000" />
    <path d="M28 25 L 34 38 L 26 36" fill="#000000" />
    <!-- Exhaust plume -->
    <path d="M10 38 Q 16 48 12 55 Q 20 46 22 38" />
  </g>

  <!-- Person standing viewing dashboard -->
  <!-- Hair & Head -->
  <path d="M298 175 C 292 170 292 188 298 198 C 308 205 320 198 316 185 C 314 175 304 172 298 175 Z" fill="#000000" />
  <path d="M302 186 C 300 188 300 195 306 195" />
  <!-- Body with hand on hip -->
  <path d="M304 200 L 298 245 L 322 245 L 325 202" />
  <path d="M300 205 C 288 215 288 232 298 232" stroke-width="3.5" /> <!-- Arm on hip -->
  <!-- Legs -->
  <line x1="304" y1="245" x2="306" y2="310" stroke-width="3.5" />
  <line x1="318" y1="245" x2="322" y2="308" stroke-width="3.5" />
  <!-- Shoes -->
  <path d="M296 314 L 312 314 L 308 310 Z" fill="#000000" />
  <path d="M316 312 L 332 312 L 324 308 Z" fill="#000000" />
</svg>
